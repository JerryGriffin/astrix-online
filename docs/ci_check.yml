# CI 回归任务（v0.4.22）
#
# 为什么放在 docs/ 而不是 .github/workflows/
#   本仓库当前使用的 GitHub 令牌 scope 为 gist / read:org / repo，**没有 workflow**。
#   GitHub 会直接拒绝任何新增 .github/workflows/* 的推送（git push 与 Git Data API 两条路
#   都会被挡），进而把整次发版卡住 —— 所以这里先以「可复制模板」的形式入库。
#
# 启用方式（获得带 workflow scope 的令牌后，二选一）：
#   git mv docs/ci_check.yml .github/workflows/check.yml && git commit && git push
#   或在网页端新建 .github/workflows/check.yml 并粘贴本文件内容。
#
# 覆盖范围说明：
#   * 只跑「不依赖浏览器」的部分 —— 13 套自检里的 v048 / v049 / smoke_browser 需要
#     playwright-core + 本机 Edge/Chromium，放在 CI 上要额外装浏览器，成本高于收益；
#   * 逻辑自检里的 selfcheck_v047 已包含「版本号 / CACHE_TAG / 全库 ?v= 自洽」断言，
#     所以「发版忘记跑 bump_imports」这类事故在 CI 上会被直接拦下。

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 全库语法检查
        run: |
          fail=0
          for f in $(find js -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          echo "syntax_bad=$fail"
          exit $fail

      # 逻辑自检不依赖 playwright-core（渲染类用自制 DOM 桩），无需 npm ci
      - name: 逻辑自检（10 套）
        run: npm run check:logic
